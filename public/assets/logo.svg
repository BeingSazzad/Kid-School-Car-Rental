<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2B68"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <path id="textPathTop" d="M 45,150 A 105,105 0 1,1 255,150" />
    <path id="textPathBottom" d="M 255,150 A 105,105 0 0,1 45,150" />
  </defs>

  <!-- Outer Ring with soft glow -->
  <circle cx="150" cy="150" r="142" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="4" />
  <circle cx="150" cy="150" r="132" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Circular Texts -->
  <text font-family="'Montserrat', 'Inter', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="4">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      HOME 2 SCHOOL
    </textPath>
  </text>

  <text font-family="'Montserrat', 'Inter', sans-serif" font-size="14" font-weight="900" fill="#FF8A00" letter-spacing="4">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      SCHOOL 2 HOME
    </textPath>
  </text>

  <!-- Separator Stars -->
  <circle cx="38" cy="150" r="4" fill="#FF8A00" />
  <circle cx="262" cy="150" r="4" fill="#FF8A00" />

  <!-- Inner Center Circle -->
  <circle cx="150" cy="150" r="78" fill="#FFFFFF" />

  <!-- Center Icons and H2S Text -->
  <g transform="translate(150, 142)">
    <path d="M -42,-12 L -28,-24 L -14,-12 L -14,6 L -42,6 Z" fill="#1B2B68" />
    <path d="M 14,-12 L 28,-24 L 42,-12 L 42,6 L 14,6 Z" fill="#1B2B68" />
    <path d="M -8,-10 L 8,-10 L 8,-14 L 14,-8 L 8,-2 L 8,-6 L -8,-6 Z" fill="#FF8A00" />
    <path d="M 8,-2 L -8,-2 L -8,2 L -14,-4 L -8,-10 L -8,-6 L 8,-6 Z" fill="#FF8A00" opacity="0.6" />

    <text x="0" y="28" font-family="'Montserrat', 'Inter', sans-serif" font-size="24" font-weight="900" fill="#1B2B68" text-anchor="middle" letter-spacing="1.5">
      H<tspan fill="#FF8A00">2</tspan>S
    </text>
  </g>
</svg>